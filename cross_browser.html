<html>
<head>
  <title>cross browser compatibility</title>
  <style>
    /* Base resets and compatibility */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%; /* Fix iOS font scaling */
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  background-image:url("https://commons.wikimedia.org/wiki/File:Pink_flower.jpg");
  color: hsl(49, 86%, 49%);
}

.navbar {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -ms-flex-pack: justify;
  justify-content: space-between;
  -ms-flex-align: center;
  align-items: center;
  background-color: #320a0a;
  padding: 1rem 2rem;
  color: rgb(248, 7, 7);
  position: relative;
  z-index: 1000;
}

.logo {
  font-size: 1.5rem;
  font-weight: bold;
  white-space: nowrap;
}

.nav-links {
  list-style: none;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  gap: 2rem;
}

.nav-links li a {
  text-decoration: none;
  color: #b0ee05;
  transition: color 0.3s ease;
}

.nav-links li a:hover,
.nav-links li a:focus {
  color: #e50b8a;
  outline: none;
}

.hamburger {
  display: none;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  cursor: pointer;
  gap: 5px;
}

.hamburger span {
  height: 3px;
  width: 25px;
  background: white;
  border-radius: 2px;
  display: block;
}

/* Responsive for smaller devices */
@media (max-width: 768px) {
  .nav-links {
    position: absolute;
    top: 70px;
    right: 0;
    background: #333;
    width: 100%;
    display: none;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0;
  }

  .nav-links.active {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
  }

  .hamburger {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
  }
}
</style>

</head>
<body>

  <nav class="navbar">
    <div class="logo">MySite</div>

    <ul class="nav-links" id="navLinks">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="hamburger" id="hamburger" role="button" aria-label="Menu" tabindex="0">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>

  <script>
    const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('navLinks');

// Toggle nav links on click
hamburger.addEventListener('click', () => {
  navLinks.classList.toggle('active');
});

// Accessibility: toggle with Enter key
hamburger.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' || e.keyCode === 13) {
    navLinks.classList.toggle('active');
  }
});

  </script>
</body>
</html>
